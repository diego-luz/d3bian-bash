# gerado pelo @@NOME@@; mude pela pagina de Ajustes, nao aqui
# Ctrl+R historico, Ctrl+T arquivos, Alt+C pastas, **<Tab> completa com o fzf
if command -v fzf >/dev/null; then
  if [[ ${BLE_VERSION-} ]]; then
    # com o ble.sh ligado, a integracao dele no lugar dos atalhos do fzf

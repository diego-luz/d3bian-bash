# Nos dois sentidos o passo confere o cadastro depois do chsh e falha se nao
# mudou. E avisa quando a sessao grafica ainda guarda o SHELL de quando entrou:
# o terminal abre esse, e so sair e entrar na sessao troca (fechar as janelas
# nao basta).
[[passo]]
tipo = "script"
se = "shell_padrao == sim"
dizer = "deixando o bash como shell do login"
corpo = '''
bash_bin=/bin/bash
usuario=${CTX_USUARIO:-$(id -un)}
case "$(getent passwd "$usuario" | cut -d: -f7)" in
  */bash) echo "o bash ja e o shell do login" ;;
  *) sudo -n chsh -s "$bash_bin" "$usuario" || true ;;
esac
agora=$(getent passwd "$usuario" | cut -d: -f7)
case "$agora" in
  */bash) ;;
  *) echo "o shell do login continua $agora; rode: chsh -s $bash_bin" >&2
     exit 1 ;;
esac
echo "shell do login: $agora"
case "${SHELL:-}" in
  */bash) ;;
  *) echo "atencao: esta sessao comecou com ${SHELL:-outro shell}; os terminais so abrem o bash depois de sair e entrar na sessao"
     echo "atencao: fechar as janelas do terminal nao basta para trocar o shell" ;;
esac
'''

[[passo]]
tipo = "script"
se = "shell_padrao == nao"
dizer = "voltando o shell do login ao de antes"
corpo = '''
usuario=${CTX_USUARIO:-$(id -un)}
# o shell de antes do projeto, guardado pela receita 00; sem ele, fica como esta
guardado=""
[ -f "$CTX_ESTADO_DIR/shell-original" ] && guardado=$(head -n1 "$CTX_ESTADO_DIR/shell-original")
# o arquivo fica numa pasta do usuario e vai para um chsh como root: so um
# shell da lista do sistema, do root; outro qualquer vira /bin/bash
if [ -n "$guardado" ]; then
  case "$guardado" in
    /*) grep -qxF -- "$guardado" /etc/shells && [ -x "$guardado" ] \
          && [ "$(stat -L -c %u "$guardado")" = 0 ] || guardado="" ;;
    *) guardado="" ;;
  esac
  if [ -z "$guardado" ]; then
    echo "atencao: shell guardado invalido; volta para /bin/bash"
    guardado=/bin/bash
  fi
fi
atual=$(getent passwd "$usuario" | cut -d: -f7)
if [ -z "$guardado" ] || [ "$guardado" = "$atual" ] || [ ! -x "$guardado" ]; then
  echo "o shell do login fica $atual"
  exit 0
fi
sudo -n chsh -s "$guardado" "$usuario" || true
agora=$(getent passwd "$usuario" | cut -d: -f7)
if [ "$agora" != "$guardado" ]; then
  echo "o shell do login continua $agora; rode: chsh -s $guardado" >&2
  exit 1
fi
echo "shell do login: $agora"
if [ "${SHELL:-}" != "$agora" ]; then
  echo "atencao: esta sessao comecou com ${SHELL:-outro shell}; os terminais so abrem o $(basename "$agora") depois de sair e entrar na sessao"
  echo "atencao: fechar as janelas do terminal nao basta para trocar o shell"
fi
'''

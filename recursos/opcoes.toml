# Preferencias que a pagina de Ajustes desenha e que as receitas usam.
#
# Cada [[opcao]] vira uma linha na pagina, dentro do cartao do seu grupo, e
# uma chave @@chave@@ nas receitas. A lista de valores tambem e a validacao:
# o servidor recusa o que nao estiver nela.
#
# Os valores de fonte e de cores sao chaves das tabelas do projeto.py, que
# calcula o nome do arquivo, a familia e as paletas.

[[opcao]]
chave = "shell_padrao"
padrao = "sim"
valores = ["sim", "nao"]
titulo = "Bash como shell padrao"
ajuda = "Se o login usa zsh ou fish, volta para o bash com chsh; Nao devolve o shell de antes do projeto"
grupo = "Shell"
nomes = { sim = "Bash", nao = "O de antes" }

[[opcao]]
chave = "base"
padrao = "sim"
valores = ["sim", "nao"]
titulo = "Bash mais confortavel"
ajuda = "Historico grande sem repetidos, setas que procuram pelo comeco, completar sem diferenca de maiusculas, cd so com o nome da pasta"
grupo = "Shell"

[[opcao]]
chave = "blesh"
padrao = "sim"
valores = ["sim", "nao"]
titulo = "Sugestoes e realce enquanto digita"
ajuda = "Pelo ble.sh, como no fish: o resto do comando aparece apagado (seta para a direita aceita) e o que nao existe fica vermelho"
grupo = "Shell"

[[opcao]]
chave = "fzf"
padrao = "sim"
valores = ["sim", "nao"]
titulo = "Busca com fzf"
ajuda = "Ctrl+R procura no historico, Ctrl+T acha arquivos e Alt+C entra em pastas"
grupo = "Shell"

[[opcao]]
chave = "saudacao"
padrao = "digitando"
valores = ["digitando", "simples", "nenhuma"]
titulo = "Saudacao ao abrir o bash"
ajuda = "Ola, nome e data; digitando letra por letra ou de uma vez"
grupo = "Shell"
nomes = { digitando = "Digitando", simples = "Simples", nenhuma = "Nenhuma" }

